name: clang-format
on: [pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run clang-format
        run: |
          CLANG_FORMAT="uvx clang-format@20" ./run-clang-format.sh
          git diff --exit-code
