name: clang-format-suggestions

# Runs with a trusted token after the (untrusted, read-only) clang-format
# workflow finishes, so it can post review suggestions on pull requests from
# forks. Same-repo PRs already get suggestions from clang-format.yml itself.
on:
  workflow_run:
    workflows: [clang-format]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  suggest:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    steps:
      - name: Download suggestion payload
        id: download
        uses: actions/github-script@v8
        with:
          result-encoding: string
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const match = artifacts.data.artifacts.find(a => a.name === 'clang-format-suggestions');
            // No payload means the PR needed no formatting; nothing to do.
            if (!match) { core.info('No suggestion payload found.'); return 'false'; }
            const dl = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: match.id,
              archive_format: 'zip',
            });
            require('fs').writeFileSync('payload.zip', Buffer.from(dl.data));
            return 'true';
      - name: Unpack payload
        if: steps.download.outputs.result == 'true'
        id: meta
        run: |
          unzip -o payload.zip -d payload
          echo "pr=$(cat payload/pr-number.txt)" >> "$GITHUB_OUTPUT"
          echo "sha=$(cat payload/head-sha.txt)" >> "$GITHUB_OUTPUT"
          echo "head_repo=$(cat payload/head-repo.txt)" >> "$GITHUB_OUTPUT"
      # Same-repo PRs already had suggestions posted by clang-format.yml; only
      # fork PRs reach this workflow needing them.
      - name: Detect fork PR
        if: steps.download.outputs.result == 'true'
        id: fork
        run: |
          if [ "${{ steps.meta.outputs.head_repo }}" != "${{ github.repository }}" ]; then
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install reviewdog
        if: steps.fork.outputs.is_fork == 'true'
        uses: reviewdog/action-setup@v1
      - name: Post suggestions
        if: steps.fork.outputs.is_fork == 'true'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_PULL_REQUEST: ${{ steps.meta.outputs.pr }}
          CI_COMMIT: ${{ steps.meta.outputs.sha }}
          CI_REPO_OWNER: ${{ github.repository_owner }}
          CI_REPO_NAME: ${{ github.event.repository.name }}
        run: |
          reviewdog -f=diff -f.diff.strip=1 -name=clang-format \
            -reporter=github-pr-review -filter-mode=added -fail-level=any \
            < payload/clang-format.patch
