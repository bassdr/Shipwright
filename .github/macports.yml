    select: [ universal ]
  - name: nlohmann-json
    select: [ universal ]
  - name: tinyxml2
    select: [ universal ]
  - name: libogg
    select: [ universal ]
  - name: libopus
    select: [ universal ]
  - name: opusfile
    select: [ universal ]
  - name: libvorbis
    select: [ universal ]