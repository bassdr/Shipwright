ports:
  - name: libsdl2
    select: [ universal ]
  - name: libsdl2_net
    select: [ universal ]
  - name: libpng
    select: [ universal ]
  - name: glew
    select: [ universal ]
  - name: libzip
    select: [ universal ]
  - name: nlohmann-json
    select: [ universal ]
  - name: tinyxml2
    select: [ universal ]
  - name: libogg
    select: [ universal ]
  - name: libopus
    select: [ universal ]
  - name: opusfile
    select: [ universal ]
  - name: libvorbis
    select: [ universal ]
  # FluidSynth itself is built from source in the macOS job (see generate-builds.yml)
  # with osal=cpp11, which drops its glib dependency. The MacPorts fluidsynth port
  # would otherwise hard-depend on portaudio (fails to build universal, unused by SoH)
  # and glib2 (also fails its universal build on the runner). libsndfile, built with
  # Ogg/Vorbis, is the only remaining dependency; it is required to decode SF3
  # (Vorbis-compressed) SoundFonts.
  - name: libsndfile
    select: [ universal ]